name: Windows installer and updater tests

# Real Windows coverage for scripts/install.ps1 and the Desktop updater
# handoff. The updater-process suite contains a win32-only detached PowerShell
# child test, and the PowerShell contract runs the production handoff script.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: installer-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust bootstrap updater contracts
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Show preinstalled Rust toolchain
        shell: pwsh
        run: |
          rustc --version
          cargo --version

      - name: Restore Cargo cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/bootstrap-installer/src-tauri/target
          key: windows-bootstrap-cargo-${{ hashFiles('apps/bootstrap-installer/src-tauri/Cargo.toml', 'apps/bootstrap-installer/src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-bootstrap-cargo-

      # Cargo.lock is intentionally ignored for this application crate. Fetch
      # once with retries, then compile and run the updater tests offline.
      - name: Fetch Rust dependencies
        uses: ./.github/actions/retry
        with:
          command: cargo fetch --manifest-path apps/bootstrap-installer/src-tauri/Cargo.toml

      - name: Run focused Rust updater tests
        shell: pwsh
        run: cargo test --offline --manifest-path apps/bootstrap-installer/src-tauri/Cargo.toml update::tests --lib

  powershell:
    name: PowerShell installer and Desktop updater tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install npm 12
        shell: pwsh
        run: npm install --global npm@12

      - name: Install JavaScript dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci --ignore-scripts

      - name: Desktop updater process and identity (real Windows children)
        working-directory: apps/desktop
        shell: pwsh
        run: npm run test:desktop:platforms -- electron/updater-process.test.ts electron/windows-process-identity.test.ts

      # Windows PowerShell 5.1 as well as pwsh 7: install.ps1 is delivered via
      # `irm | iex` into whatever shell the user already has, and 5.1 is what
      # ships with Windows. A construct that only parses under 7 is a broken
      # installer for most of the people hitting it.
      - name: PowerShell installer behavior (pwsh 7)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-install-ps1-longpath.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-install-ps1-stage-protocol.ps1

      - name: PowerShell installer behavior (Windows PowerShell 5.1)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-install-ps1-longpath.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-install-ps1-stage-protocol.ps1

      - name: Hermes Windows shortcut registration (pwsh 7)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-windows-desktop-shortcuts.ps1

      - name: Hermes Windows shortcut registration (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-windows-desktop-shortcuts.ps1

      # This executes scripts/desktop-update.ps1 against an isolated fake
      # install. Running it under both engines catches syntax and runtime
      # differences between inbox Windows PowerShell and modern pwsh.
      - name: Desktop update handoff (pwsh 7)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-desktop-update-handoff.ps1

      - name: Desktop update handoff (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-desktop-update-handoff.ps1

  fork-integration:
    name: Fork-integration release system
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra dev

      - name: Loader / resolution / patch-id suite
        shell: pwsh
        run: uv run python -m pytest tests/cron/test_fork_integration_release.py -q

      # Byte-pure-imported script; no repo edits. Pins the earliest
      # fail-closed gate reachable in a fake install (see the script's own
      # header comment in scripts/tests/test-fork-integration-release.ps1
      # for why USERPROFILE, not HERMES_HOME, is the override that matters).
      - name: Dry-run fail-closed gate (pwsh 7)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-fork-integration-release.ps1
