name: Native Windows updater tests

# Contract suite for updater behavior that cannot be proved on Linux:
# PowerShell 5.1 compatibility, Windows Job/process identity, and the Rust and
# Electron implementations that coordinate the same lease/handoff protocol.
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-update-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell:
    name: PowerShell handoff contracts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run handoff contracts (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-desktop-update-handoff.ps1

      - name: Run handoff contracts (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-desktop-update-handoff.ps1

  rust:
    name: Rust bootstrap updater contracts
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Show preinstalled Rust toolchain
        shell: pwsh
        run: |
          rustc --version
          cargo --version

      - name: Restore Cargo cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/bootstrap-installer/src-tauri/target
          key: windows-updater-cargo-${{ hashFiles('apps/bootstrap-installer/src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-updater-cargo-

      - name: Fetch locked Rust dependencies
        uses: ./.github/actions/retry
        with:
          command: cargo fetch --locked --manifest-path apps/bootstrap-installer/src-tauri/Cargo.toml

      - name: Run focused Rust updater tests
        shell: pwsh
        run: cargo test --locked --offline --manifest-path apps/bootstrap-installer/src-tauri/Cargo.toml update::tests --lib

  electron:
    name: Electron updater contracts (Windows)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install npm 12
        shell: pwsh
        run: npm install --global npm@12

      - name: Install JavaScript dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Build and pack Desktop (Windows)
        shell: pwsh
        timeout-minutes: 15
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run --prefix apps/desktop pack

      # Run the project-native Electron test project, not a hand-maintained
      # filename list. This includes the real win32-only process creation
      # identity proof that the Ubuntu JS lane necessarily skips.
      - name: Run Electron platform tests
        shell: pwsh
        run: npm run --prefix apps/desktop test:desktop:platforms

  integration:
    name: Desktop updater integration (Windows)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install npm 12
        shell: pwsh
        run: npm install --global npm@12

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.9.28'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install Python test environment
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra dev

      - name: Run the disposable managed-install transaction
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-desktop-update-integration.ps1 -SeedVenv .venv
